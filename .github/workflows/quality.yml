name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Memory Admin contract
        run: npm --workspace apps/desktop run memory-contract:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  native-tests:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js for native prerequisites
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets embedded by custom-protocol
        run: npm --workspace apps/desktop run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Clippy all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-fail-fast

      - name: Native rich document paste
        if: runner.os == 'macOS'
        run: node apps/desktop/scripts/test-native-clipboard.mjs

  desktop-browser:
    name: Desktop editor and clipboard
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm exec --workspace apps/desktop -- playwright install chromium webkit
      - name: Bundled offline translation with production CSP
        run: npm --workspace apps/desktop run test:offline-translation -- --webkit
      - run: npm --workspace apps/desktop run test:ui
      - name: Paste actual Mermaid images into a native rich text receiver
        run: npm --workspace apps/desktop run test:native-clipboard -- test-results/real-mermaid-clipboard.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: desktop-browser-test-results
          path: apps/desktop/test-results
