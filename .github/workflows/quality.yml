name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Memory Admin contract
        run: npm --workspace apps/desktop run memory-contract:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  native-tests:
    name: Native tests
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Run native tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --no-fail-fast

      - name: Setup Node.js for clipboard receiver test
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Native rich document paste
        run: node apps/desktop/scripts/test-native-clipboard.mjs
