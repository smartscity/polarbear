name: Release Polarbear

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing desktop release tag, for example v0.9.1"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/scripts/**"
      - "apps/desktop/package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write

jobs:
  caption_gate:
    name: Native caption gate
    uses: ./.github/workflows/caption.yml
    with:
      ref: ${{ inputs.release_tag || github.ref }}

  build_macos:
    name: Build macOS DMG
    needs: caption_gate
    runs-on: macos-26
    outputs:
      app_version: ${{ steps.release_metadata.outputs.app_version }}
      release_tag: ${{ steps.release_metadata.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm --workspace apps/desktop run typecheck

      - name: Lint
        run: npm --workspace apps/desktop run lint

      - name: Frontend tests
        run: npm --workspace apps/desktop run test

      - name: Native rich document paste
        run: npm --workspace apps/desktop run test:native-clipboard

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Resolve release metadata
        id: release_metadata
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG=""
          VERSION=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [[ -n "$INPUT_RELEASE_TAG" || "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${INPUT_RELEASE_TAG:-$GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid tag: $TAG"
              echo "Expected tag format: v0.1.7"
              exit 1
            fi
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync Tauri version from tag
        run: |
          export APP_VERSION="${APP_VERSION}"

          node <<'NODE'
          const fs = require('fs');

          const version = process.env.APP_VERSION;

          if (!version) {
            console.error('APP_VERSION is empty');
            process.exit(1);
          }

          const jsonFiles = [
            'apps/desktop/src-tauri/tauri.conf.json',
            'apps/desktop/package.json',
            'package.json'
          ];

          for (const file of jsonFiles) {
            if (!fs.existsSync(file)) continue;

            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');

            console.log(`Updated ${file} -> ${version}`);
          }
          NODE

      - name: Verify version before build
        run: |
          echo "APP_VERSION=$APP_VERSION"
          echo "RELEASE_TAG=$RELEASE_TAG"

          echo "---- tauri.conf.json ----"
          grep -n '"version"' apps/desktop/src-tauri/tauri.conf.json || true

          echo "---- apps/desktop/package.json ----"
          grep -n '"version"' apps/desktop/package.json || true

          echo "---- root package.json ----"
          grep -n '"version"' package.json || true

      - name: Build macOS DMG
        env:
          TAURI_ENV_TARGET_TRIPLE: universal-apple-darwin
        run: |
          cd apps/desktop
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Locate required release artifacts
        run: node apps/desktop/scripts/macos-release-artifacts.mjs --target universal-apple-darwin --github-env

      - name: Verify bundled caption engine with offline audio
        run: |
          set -o pipefail
          COMMIT=$(node -p "require('./apps/desktop/src-tauri/resources/caption/manifest.json').engine.commit")
          lipo "$APP_BUNDLE/Contents/MacOS/polarbear-desktop" -verify_arch arm64 x86_64
          lipo "$CAPTION_ASSETS/polarbear-caption-engine" -verify_arch arm64 x86_64
          node apps/desktop/scripts/test-caption-engine.mjs "apps/desktop/src-tauri/target/caption-native/whisper.cpp-${COMMIT}/samples/jfk.wav" "$CAPTION_ASSETS" 2>&1 | tee caption-fixture.log

      - name: Verify caption engine inside DMG
        run: |
          set -o pipefail
          MOUNT=$(mktemp -d)
          trap 'hdiutil detach "$MOUNT"; rmdir "$MOUNT"' EXIT
          hdiutil attach "$DMG_SOURCE" -mountpoint "$MOUNT" -readonly -nobrowse
          PRODUCT=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').productName")
          ASSETS="$MOUNT/$PRODUCT.app/Contents/Resources/resources/caption"
          lipo "$ASSETS/polarbear-caption-engine" -verify_arch arm64 x86_64
          COMMIT=$(node -p "require('./apps/desktop/src-tauri/resources/caption/manifest.json').engine.commit")
          node apps/desktop/scripts/test-caption-engine.mjs "apps/desktop/src-tauri/target/caption-native/whisper.cpp-${COMMIT}/samples/jfk.wav" "$ASSETS" 2>&1 | tee caption-dmg-fixture.log

      - name: Upload caption verification diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: caption-release-diagnostics
          path: |
            caption-fixture.log
            caption-dmg-fixture.log
          if-no-files-found: ignore

      - name: Locate and rename DMG
        run: |
          echo "Original DMG: $DMG_SOURCE"

          RENAMED_DMG="Polarbear_${APP_VERSION}.dmg"
          cp "$DMG_SOURCE" "$RENAMED_DMG"

          echo "DMG_FILE=$RENAMED_DMG" >> "$GITHUB_ENV"

          echo "Renamed DMG:"
          ls -la "$RENAMED_DMG"

      - name: Show bundle files
        run: |
          echo "DMG files:"
          find . -type f -name "*.dmg" -print

          echo "macOS app bundles:"
          find . -type d -path "*/bundle/macos/*.app" -print

      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Polarbear-macOS-${{ env.APP_VERSION }}
          path: ${{ env.DMG_FILE }}
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"

          echo "Uploading $DMG_FILE to release $TAG"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Polarbear ${APP_VERSION}" \
              --notes "Polarbear macOS DMG release." \
              --draft

          if [[ "$APP_VERSION" == *-* ]]; then
            gh release edit "$TAG" --prerelease
          fi

          gh release upload "$TAG" "$DMG_FILE" --clobber

  build_windows:
    name: Build Windows installers
    needs: build_macos
    if: needs.build_macos.outputs.release_tag != ''
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.build_macos.outputs.app_version }}
      RELEASE_TAG: ${{ needs.build_macos.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Sync Tauri version from tag
        shell: bash
        run: |
          export APP_VERSION="${APP_VERSION}"

          node <<'NODE'
          const fs = require('fs');

          const version = process.env.APP_VERSION;

          if (!version) {
            console.error('APP_VERSION is empty');
            process.exit(1);
          }

          const jsonFiles = [
            'apps/desktop/src-tauri/tauri.conf.json',
            'apps/desktop/package.json',
            'package.json'
          ];

          for (const file of jsonFiles) {
            if (!fs.existsSync(file)) continue;

            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');

            console.log(`Updated ${file} -> ${version}`);
          }
          NODE

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis

      - name: Locate and rename Windows installer
        shell: pwsh
        run: |
          $nsis = Get-ChildItem -Path . -Recurse -File -Filter *.exe |
            Where-Object { $_.FullName -like '*\bundle\nsis\*' } |
            Select-Object -First 1

          if (-not $nsis) {
            Write-Error 'No NSIS installer found.'
            exit 1
          }

          $renamedNsis = "Polarbear_${env:APP_VERSION}_x64-setup.exe"
          Copy-Item $nsis.FullName $renamedNsis

          "WINDOWS_NSIS=$renamedNsis" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG $env:WINDOWS_NSIS --clobber
