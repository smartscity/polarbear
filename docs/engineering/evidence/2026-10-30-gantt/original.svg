基数）     </text><text id="gantt-evidence-1-b1-text" font-size="11" x="237" y="87.5" class="taskTextOutsideRight taskTextOutside0  critText0 width-152.796875">6 笔成交以 -14745 为基数清算              </text><text id="gantt-evidence-1-b2-text" font-size="11" x="248" y="111.5" class="taskTextOutsideRight taskTextOutside0  milestoneText width-135.03125">快照 1730 生成，多空差 18                 </text><text id="gantt-evidence-1-b3-text" font-size="11" x="248" y="135.5" class="taskTextOutsideRight taskTextOutside0  milestoneText width-146.796875">首次告警 1730-1740，diff 18             </text><text id="gantt-evidence-1-r1-text" font-size="11" x="719" y="279.5" class="taskText taskText2 activeText2 width-138.1875">每 10 分钟一条，共 1709 条                </text><text id="gantt-evidence-1-a1-text" font-size="11" x="309" y="159.5" class="taskTextOutsideRight taskTextOutside1  critText1 width-126.984375">35 对成交已成交、未落库                   </text><text id="gantt-evidence-1-a2-text" font-size="11" x="303" y="183.5" class="taskTextOutsideRight taskTextOutside1  width-195.453125">快照 1130~1240 生成，没看到这些成交         </text><text id="gantt-evidence-1-a3-text" font-size="11" x="319" y="207.5" class="taskTextOutsideRight taskTextOutside1  milestoneText width-211.796875">14:40 落库，版本仍为 1130~1240           </text><text id="gantt-evidence-1-a4-text" font-size="11" x="321" y="231.5" class="taskTextOutsideRight taskTextOutside1  milestoneText width-253.125">2074… 15:08 再成交，快照 1500 带上 -41    </text><text id="gantt-evidence-1-a5-text" font-size="11" x="322" y="255.5" class="taskTextOutsideRight taskTextOutside1  milestoneText width-151.5625">告警 1500-1510，diff 变成 59             </text><text id="gantt-evidence-1-r2-text" font-size="11" x="1189" y="303.5" class="taskTextOutsideLeft taskTextOutside2  milestoneText">本次告警 1530-1540                      </text></g><g><text dy="0em" x="10" y="98" font-size="11" class="sectionTitle sectionTitle0"><tspan alignment-baseline="central" x="10">问题 ② 旧持仓基数</tspan></text><text dy="0em" x="10"